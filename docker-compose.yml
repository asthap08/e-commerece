# Local full-stack: docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: commerce }
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d commerce"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://app:app@db:5432/commerce?sslmode=disable
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      CHECKOUT_ENABLED: "true"
      PUBLIC_URL: http://localhost:3000
    depends_on: { db: { condition: service_healthy } }
    ports: ["8080:8080"]
  worker:
    build: ./backend
    command: ["worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://app:app@db:5432/commerce?sslmode=disable
      CORS_ORIGINS: http://localhost:3000
    depends_on: [api]
  frontend:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080", NEXT_PUBLIC_DEMO_MODE: "false" } }
    ports: ["3000:3000"]
  admin:
    build: { context: ./admin, args: { VITE_API_BASE_URL: "http://localhost:8080" } }
    environment: { API_ORIGIN: "http://localhost:8080" }
    ports: ["3001:80"]
volumes: { dbdata: {} }
